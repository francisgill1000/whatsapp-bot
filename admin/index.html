<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rezzy Admin — Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #110e0b;
    --bg2: #1a1612;
    --panel: rgba(36, 30, 25, 0.55);
    --panel2: rgba(46, 39, 33, 0.65);
    --panel-solid: #1d1916;
    --line: rgba(255, 235, 210, 0.06);
    --line2: rgba(255, 235, 210, 0.11);
    --ink: #f5efe7;
    --ink2: #b8ad9f;
    --ink3: #8a7f73;
    --ink4: #5a5048;
    --coral: #e87b56;
    --coral-dim: #c96442;
    --coral-soft: rgba(232,123,86,0.14);
    --coral-glow: rgba(232,123,86,0.28);
    --green: #7bb87a;
    --amber: #e0b04a;
    --red: #e07a6b;
    --blur: 14px;
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 8px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--ink); }
  body {
    display: flex; flex-direction: column; min-height: 100vh; overflow: hidden;
    background:
      radial-gradient(900px 600px at 12% -10%, rgba(232,123,86,0.18), transparent 60%),
      radial-gradient(700px 500px at 95% 110%, rgba(201,100,66,0.12), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
  }
  kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 4px;
    background: var(--panel2); border: 1px solid var(--line2); border-bottom: 2px solid var(--line2);
    border-radius: 4px; font-size: 10.5px; font-family: ui-monospace, "SF Mono", monospace;
    color: var(--ink2); font-weight: 600;
  }
  button { font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink4); }

  /* Top bar */
  .topbar {
    height: 56px; flex-shrink: 0; padding: 0 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(22, 18, 14, 0.55);
    backdrop-filter: saturate(160%) blur(var(--blur));
    -webkit-backdrop-filter: saturate(160%) blur(var(--blur));
    display: flex; align-items: center; gap: 16px;
    position: relative; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, #f08862 0%, var(--coral) 60%, var(--coral-dim) 100%);
    box-shadow: 0 4px 14px rgba(232,123,86,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    color: #1a1410; font-weight: 700; font-size: 13px;
  }
  .brand-name { font-weight: 600; color: var(--ink); font-size: 14px; letter-spacing: -0.01em; }
  .brand-sep { color: var(--ink4); font-size: 12px; }
  .brand-section { font-size: 13.5px; color: var(--ink2); }
  .search-wrap { flex: 1; max-width: 460px; margin-left: 20px; }
  .search {
    display: flex; align-items: center; gap: 9px; padding: 7px 12px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: var(--radius-md);
    transition: border-color 160ms var(--ease), background 160ms var(--ease);
  }
  .search:focus-within { border-color: var(--coral-glow); background: rgba(255,255,255,0.04); }
  .search-icon { color: var(--ink3); font-size: 13px; }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--ink); font-size: 13px; font-family: inherit;
  }
  .search input::placeholder { color: var(--ink3); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .shortcut { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink3); }
  .shortcut .keys { display: inline-flex; gap: 2px; }
  .v-sep { width: 1px; height: 20px; background: var(--line2); }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%; background: #7a8c5c;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: white;
  }
  .logout-form { display: inline-flex; margin: 0; }
  .logout-btn {
    padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line2);
    background: rgba(255,255,255,0.03); color: var(--ink2); font-size: 12px; font-weight: 500;
    transition: all 160ms var(--ease);
  }
  .logout-btn:hover { background: rgba(255,255,255,0.06); color: var(--ink); border-color: rgba(255,255,255,0.16); }
  .deploy-btn {
    padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line2);
    background: rgba(255,255,255,0.03); color: var(--ink2); font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px;
    transition: all 160ms var(--ease);
  }
  .deploy-btn:hover {
    background: rgba(232,123,86,0.08); color: var(--ink); border-color: var(--coral-glow);
    box-shadow: 0 0 0 3px rgba(232,123,86,0.08);
  }
  .deploy-btn.busy { opacity: 0.6; cursor: progress; }
  .deploy-btn.ok { border-color: var(--green); color: var(--green); }
  .deploy-btn.err { border-color: var(--red); color: var(--red); }
  .deploy-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
  .deploy-btn.busy .dot { background: var(--amber); }
  .deploy-btn.ok .dot { background: var(--green); }
  .deploy-btn.err .dot { background: var(--red); }

  /* Main split */
  .main { flex: 1; display: flex; min-height: 0; }

  /* List pane */
  .list-pane {
    width: 340px; flex: 0 0 340px; border-right: 1px solid var(--line);
    background: rgba(20, 16, 13, 0.35);
    backdrop-filter: saturate(140%) blur(var(--blur));
    -webkit-backdrop-filter: saturate(140%) blur(var(--blur));
    display: flex; flex-direction: column; min-height: 0;
  }
  .list-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .list-title-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .list-title { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -0.015em; }
  .list-count { font-size: 11.5px; color: var(--ink3); }
  .list-count .refresh {
    margin-left: 8px; background: transparent; border: none; color: var(--ink3);
    cursor: pointer; padding: 0; font-size: 12px;
    transition: color 160ms var(--ease), transform 200ms var(--ease);
  }
  .list-count .refresh:hover { color: var(--coral); transform: rotate(60deg); }
  .tabs {
    display: flex; gap: 3px; padding: 3px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: var(--radius-md);
  }
  .tab {
    padding: 6px 10px; border-radius: 7px; border: none; background: transparent;
    color: var(--ink2); font-size: 12.5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; flex: 1; justify-content: center;
    transition: all 160ms var(--ease);
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    background: rgba(255,255,255,0.06); color: var(--ink);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .tab-count { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; font-weight: 500; }
  .list { flex: 1; overflow-y: auto; min-height: 0; padding: 6px 8px; }
  .list-empty { padding: 40px 20px; text-align: center; color: var(--ink3); font-size: 12.5px; }
  .row {
    display: flex; align-items: center; gap: 11px; padding: 11px 12px;
    cursor: pointer; position: relative; border-radius: var(--radius-md);
    margin-bottom: 2px;
    transition: background 160ms var(--ease), box-shadow 200ms var(--ease);
  }
  .row:hover { background: rgba(255,255,255,0.04); }
  .row.selected {
    background: linear-gradient(135deg, rgba(232,123,86,0.16) 0%, rgba(232,123,86,0.06) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(232,123,86,0.30),
      0 6px 22px -8px rgba(232,123,86,0.35);
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--coral); }
  .status-dot.new { background: var(--coral); }
  .status-dot.contacted { background: var(--amber); }
  .status-dot.booked { background: var(--green); }
  .status-dot.junk { background: var(--ink4); }
  .status-dot.lost { background: var(--red); }
  .row-body { flex: 1; min-width: 0; }
  .row-line1 { display: flex; align-items: baseline; gap: 8px; }
  .row-name {
    font-size: 13px; font-weight: 550; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .row.selected .row-name { font-weight: 600; }
  .row.junk .row-name { color: var(--ink3); font-style: italic; }
  .row-time { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .row-line2 {
    display: flex; align-items: center; gap: 6px; margin-top: 2px;
    font-size: 11.5px; color: var(--ink3); overflow: hidden;
  }
  .row-city { color: var(--ink2); }
  .row-phone { font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; }
  .row-sep { opacity: 0.5; }
  .dup-badge {
    margin-left: auto; font-size: 9.5px; padding: 1px 5px; border-radius: 3px;
    background: var(--line2); color: var(--ink3); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .list-footer {
    padding: 10px 14px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink3);
    display: flex; justify-content: space-between; align-items: center;
  }

  /* Detail pane */
  .detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .detail-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--ink3); font-size: 13px;
  }
  .detail-header { padding: 26px 36px 20px; border-bottom: 1px solid var(--line); }
  .detail-head-row { display: flex; align-items: center; gap: 18px; }
  .swatch {
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    color: white; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.14);
  }
  .detail-titlecol { flex: 1; min-width: 0; }
  .detail-titlerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .detail-name { margin: 0; font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -0.015em; }
  .detail-name.junk { font-style: italic; }
  .status-chips { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .status-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px 3px 8px; border-radius: 999px;
    background: rgba(255,255,255,0.025); border: 1px solid var(--line2);
    color: var(--ink3); font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 140ms var(--ease);
    font-family: inherit;
  }
  .status-chip:hover { color: var(--ink2); border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); }
  .status-chip.active { cursor: default; }
  .status-chip.active.s-new      { background: rgba(232,123,86,0.14); border-color: rgba(232,123,86,0.35); color: var(--coral); box-shadow: 0 0 0 3px rgba(232,123,86,0.10); }
  .status-chip.active.s-contacted{ background: rgba(224,176,74,0.14); border-color: rgba(224,176,74,0.38); color: var(--amber); box-shadow: 0 0 0 3px rgba(224,176,74,0.10); }
  .status-chip.active.s-booked   { background: rgba(123,184,122,0.14); border-color: rgba(123,184,122,0.40); color: var(--green); box-shadow: 0 0 0 3px rgba(123,184,122,0.10); }
  .status-chip.active.s-lost     { background: rgba(224,122,107,0.14); border-color: rgba(224,122,107,0.40); color: var(--red);   box-shadow: 0 0 0 3px rgba(224,122,107,0.10); }
  .status-chip.active.s-junk     { background: rgba(255,255,255,0.06); border-color: var(--line2); color: var(--ink2); }
  .status-chip[disabled] { opacity: 0.5; cursor: progress; }
  .btn-danger {
    padding: 9px 11px; border-radius: var(--radius-md);
    border: 1px solid var(--line2); background: rgba(255,255,255,0.03); color: var(--ink2);
    font-size: 13px;
    transition: all 160ms var(--ease);
  }
  .btn-danger:hover {
    background: rgba(224,122,107,0.10); color: var(--red); border-color: rgba(224,122,107,0.35);
    box-shadow: 0 0 0 3px rgba(224,122,107,0.08);
  }
  .detail-meta {
    margin-top: 6px; font-size: 12.5px; color: var(--ink3);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .detail-meta .mono { font-family: ui-monospace, monospace; }
  .detail-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-primary {
    padding: 9px 16px; border-radius: var(--radius-md); border: none;
    background: linear-gradient(135deg, #f08862 0%, var(--coral) 100%);
    color: white; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; text-decoration: none;
    box-shadow:
      0 6px 20px -6px rgba(232,123,86,0.50),
      inset 0 1px 0 rgba(255,255,255,0.20);
    transition: all 160ms var(--ease);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow:
      0 10px 26px -8px rgba(232,123,86,0.60),
      inset 0 1px 0 rgba(255,255,255,0.24);
  }
  .btn-primary kbd {
    font-size: 10px; padding: 1px 5px; background: rgba(0,0,0,0.22);
    border: none; border-radius: 4px; color: white;
  }
  .btn-secondary {
    padding: 9px 16px; border-radius: var(--radius-md);
    border: 1px solid var(--line2); background: rgba(255,255,255,0.03); color: var(--ink);
    font-size: 13px; font-weight: 500;
    transition: all 160ms var(--ease);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.16); }
  .btn-icon {
    padding: 9px 11px; border-radius: var(--radius-md);
    border: 1px solid var(--line2); background: rgba(255,255,255,0.03); color: var(--ink2);
    font-size: 13px;
    transition: all 160ms var(--ease);
  }
  .btn-icon:hover { background: rgba(255,255,255,0.06); color: var(--ink); }
  .field-grid {
    margin-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  }
  .field-label {
    font-size: 10.5px; color: var(--ink4); text-transform: uppercase;
    letter-spacing: 0.07em; font-weight: 600; margin-bottom: 4px;
  }
  .field-value { font-size: 12.5px; color: var(--ink2); }

  .convo-wrap { flex: 1; overflow-y: auto; padding: 20px 32px 24px; }
  .convo-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .convo-title {
    font-size: 10.5px; color: var(--ink4); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 700;
  }
  .convo-divider { flex: 1; height: 1px; background: var(--line); }
  .convo-count { font-size: 11.5px; color: var(--ink3); }
  .convo { display: flex; flex-direction: column; gap: 10px; max-width: 620px; }
  .convo-empty {
    padding: 32px 24px; text-align: center; color: var(--ink3); font-size: 12.5px;
    background: rgba(255,255,255,0.025); border: 1px dashed var(--line2); border-radius: var(--radius-lg);
    max-width: 620px;
  }
  .bubble {
    max-width: 78%; padding: 10px 15px; border-radius: 16px;
    font-size: 13px; line-height: 1.5;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .bubble-meta {
    font-size: 10px; color: var(--ink4); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: 600; margin-bottom: 3px;
  }
  .bubble.bot {
    align-self: flex-start; background: rgba(255,255,255,0.04);
    border: 1px solid var(--line); border-bottom-left-radius: 5px; color: var(--ink);
  }
  .bubble.user {
    align-self: flex-end; background: rgba(123, 184, 122, 0.14);
    border: 1px solid rgba(123, 184, 122, 0.22); border-bottom-right-radius: 5px; color: var(--ink);
  }
  .quick-actions {
    margin-top: 22px; padding: 16px 18px; background: rgba(255,255,255,0.025);
    border-radius: var(--radius-lg); border: 1px solid var(--line); max-width: 620px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .quick-actions-title {
    font-size: 10.5px; color: var(--ink4); text-transform: uppercase;
    letter-spacing: 0.07em; font-weight: 700; margin-bottom: 8px;
  }
  .quick-actions-row { display: flex; gap: 16px; flex-wrap: wrap; }

  /* Mobile back button — shown on small screens only */
  .mobile-back {
    display: none;
    width: 36px; height: 36px; flex-shrink: 0;
    border-radius: 50%; border: 1px solid var(--line2);
    background: rgba(255,255,255,0.04); color: var(--ink2);
    align-items: center; justify-content: center;
    font-size: 18px; line-height: 1;
    transition: all 160ms var(--ease);
  }
  .mobile-back:hover { background: rgba(255,255,255,0.08); color: var(--ink); }

  /* Tablet — collapse to single column, smaller paddings */
  @media (max-width: 820px) {
    .field-grid { grid-template-columns: repeat(2, 1fr); }
    .detail-header { padding: 16px 20px 14px; }
    .convo-wrap { padding: 14px 20px 20px; }
    .topbar-right .shortcut { display: none; }
    .search-wrap { max-width: none; margin-left: 8px; }
  }

  /* Phone — two-screen flow (inbox ↔ detail) */
  @media (max-width: 720px) {
    body { overflow: hidden; }
    .topbar { height: 52px; padding: 0 12px; gap: 10px; }
    .brand-sep, .brand-section { display: none; }
    .search-wrap { margin-left: 0; }
    .search kbd { display: none; }
    .deploy-btn span:not(.dot) { display: none; }
    .deploy-btn { padding: 6px 8px; }
    .logout-btn { padding: 6px 10px; }
    .v-sep { display: none; }

    .main { position: relative; flex: 1; min-height: 0; }
    .list-pane,
    .detail {
      position: absolute; inset: 0;
      width: 100%; max-height: none; border: none;
      transition: transform 220ms var(--ease);
    }
    .list-pane { transform: translateX(0); z-index: 2; }
    .detail { transform: translateX(100%); z-index: 3; background: var(--bg); }
    body.show-detail .list-pane { transform: translateX(-12%); }
    body.show-detail .detail   { transform: translateX(0); }

    .list-header { padding: 12px 14px 10px; }
    .list { padding: 6px; }
    .row { padding: 13px 12px; }                 /* larger tap target */
    .row-name { font-size: 14px; }
    .row-line2 { font-size: 12px; }

    .mobile-back { display: inline-flex; }
    .detail-header { padding: 14px 16px 14px; }
    .detail-head-row { flex-wrap: wrap; gap: 12px; }
    .detail-titlecol { flex: 1 1 100%; order: 2; min-width: 0; }
    .swatch { width: 40px; height: 40px; font-size: 15px; border-radius: 10px; }
    .detail-name { font-size: 18px; }
    .detail-actions {
      order: 3; width: 100%;
      display: grid; grid-template-columns: 1fr auto; gap: 8px;
    }
    .btn-primary { justify-content: center; padding: 11px 14px; }
    .btn-primary kbd { display: none; }
    .btn-danger { padding: 11px 14px; }
    .status-chips { gap: 4px; }
    .status-chip { padding: 4px 9px; font-size: 11.5px; }
    .field-grid { grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .field-value { font-size: 12px; word-break: break-word; }
    .detail-meta .mono { white-space: nowrap; }

    .convo-wrap { padding: 14px 16px 24px; }
    .quick-actions { display: none; }            /* keyboard shortcuts irrelevant on phone */
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-logo">R</div>
    <div class="brand-name">Rezzy</div>
    <span class="brand-sep">/</span>
    <span class="brand-section">Leads</span>
  </div>
  <div class="search-wrap">
    <div class="search">
      <span class="search-icon">⌕</span>
      <input id="search" placeholder="Search salon, city, or phone…" autocomplete="off">
      <kbd>⌘K</kbd>
    </div>
  </div>
  <div class="topbar-right">
    <span class="shortcut"><span class="keys"><kbd>G</kbd><kbd>I</kbd></span><span>Inbox</span></span>
    <span class="shortcut"><span class="keys"><kbd>?</kbd></span><span>Shortcuts</span></span>
    <div class="v-sep"></div>
    <button type="button" id="deployBtn" class="deploy-btn" title="git pull + pm2 restart">
      <span class="dot"></span><span id="deployLabel">Deploy</span>
    </button>
    <form class="logout-form" method="POST" action="/admin/logout">
      <button type="submit" class="logout-btn" title="Sign out">Logout</button>
    </form>
  </div>
</header>

<div class="main">
  <aside class="list-pane">
    <div class="list-header">
      <div class="list-title-row">
        <h1 class="list-title">Inbox</h1>
        <div class="list-count">
          <span id="count">…</span>
          <button class="refresh" id="refresh" title="Refresh">↻</button>
        </div>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="all">All <span class="tab-count" id="count-all">0</span></button>
        <button class="tab" data-tab="new">New <span class="tab-count" id="count-new">0</span></button>
        <button class="tab" data-tab="junk">Junk <span class="tab-count" id="count-junk">0</span></button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="list-footer">
      <span id="sync-status">Loading…</span>
      <span class="shortcut"><span class="keys"><kbd>J</kbd><kbd>K</kbd></span><span>Navigate</span></span>
    </div>
  </aside>

  <section class="detail" id="detail">
    <div class="detail-empty">Select a lead</div>
  </section>
</div>

<script>
const SWATCH_PALETTE = ['#c96442','#d97757','#7a8c5c','#5c7a8c','#8c5c7a','#b88a3a','#3a8a8a','#9b6f3a'];
const JUNK_PATTERNS = /^(hi|hello|hey|test|\.+|\?+|\s*)$/i;
const STATE = { leads: [], filtered: [], selectedId: null, tab: 'all', query: '' };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function deriveInitials(name) {
  const trimmed = String(name || '').trim();
  if (!trimmed) return '?';
  const parts = trimmed.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return trimmed.slice(0, 2).toUpperCase();
}

function deriveSwatch(name) {
  if (!name) return '#5a5048';
  return SWATCH_PALETTE[hash(name) % SWATCH_PALETTE.length];
}

function isJunk(name) {
  return JUNK_PATTERNS.test(String(name || '').trim());
}

function fmtPhone(raw) {
  if (!raw) return '';
  const s = String(raw).replace(/\D/g, '');
  if (s.startsWith('971') && s.length === 12) return `+971 ${s.slice(3,5)} ${s.slice(5,8)} ${s.slice(8)}`;
  if (s.startsWith('92') && s.length === 12)  return `+92 ${s.slice(2,5)} ${s.slice(5,8)} ${s.slice(8)}`;
  if (s.startsWith('1') && s.length === 11)   return `+1 ${s.slice(1,4)} ${s.slice(4,7)} ${s.slice(7)}`;
  return '+' + s;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function fmtRel(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const mins = Math.round((Date.now() - d) / 60000);
  if (mins < 1) return 'now';
  if (mins < 60) return mins + 'm';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h';
  const days = Math.round(hrs / 24);
  if (days < 7) return days + 'd';
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

function fmtFullDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function normalize(raw) {
  // Map server lead → design model. Mark duplicates by phone (later entries flagged).
  const seenPhone = new Map();
  return raw.map((l, i) => {
    const id = l.id || `l${i}`;
    const name = l.name || '';
    const phone = l.from || '';
    const status = l.status || (isJunk(name) ? 'junk' : 'new');
    const junk = status === 'junk';
    const prev = seenPhone.get(phone);
    if (!seenPhone.has(phone) && phone) seenPhone.set(phone, id);
    return {
      id,
      salon: name || '(no name)',
      city: l.city || null,
      whatsapp: phone,
      at: l.savedAt || l.at || null,
      status,
      service: l.service || null,
      note: l.note || null,
      initials: junk ? '?' : deriveInitials(name),
      swatch: junk ? '#5a5048' : deriveSwatch(name),
      junk,
      duplicate: !junk && !!prev && prev !== id,
    };
  });
}

function applyFilters() {
  const q = STATE.query.trim().toLowerCase();
  let list = STATE.leads.slice();

  // Tab filter
  if (STATE.tab === 'junk') list = list.filter(l => l.junk);
  else if (STATE.tab === 'new') list = list.filter(l => !l.junk && l.status === 'new');
  else list = list.filter(l => !l.junk);

  // Search
  if (q) {
    list = list.filter(l =>
      (l.salon || '').toLowerCase().includes(q) ||
      (l.city || '').toLowerCase().includes(q) ||
      (l.whatsapp || '').includes(q)
    );
  }

  // Sort newest first
  list.sort((a, b) => (b.at || '').localeCompare(a.at || ''));

  STATE.filtered = list;

  // Keep selection valid
  if (!list.find(l => l.id === STATE.selectedId)) {
    STATE.selectedId = list[0]?.id || null;
  }
}

function renderCounts() {
  const all = STATE.leads.filter(l => !l.junk);
  document.getElementById('count-all').textContent = all.length;
  document.getElementById('count-new').textContent = all.filter(l => l.status === 'new').length;
  document.getElementById('count-junk').textContent = STATE.leads.filter(l => l.junk).length;
  const visibleTotal = STATE.filtered.length;
  document.getElementById('count').textContent = `${visibleTotal} lead${visibleTotal === 1 ? '' : 's'}`;
}

function renderList() {
  const el = document.getElementById('list');
  if (STATE.filtered.length === 0) {
    el.innerHTML = '<div class="list-empty">No leads match.</div>';
    return;
  }
  el.innerHTML = STATE.filtered.map(l => `
    <div class="row ${l.id === STATE.selectedId ? 'selected' : ''} ${l.junk ? 'junk' : ''}" data-id="${esc(l.id)}">
      <span class="status-dot ${esc(l.status)}"></span>
      <div class="row-body">
        <div class="row-line1">
          <div class="row-name">${esc(l.salon)}</div>
          <div class="row-time">${esc(fmtRel(l.at))}</div>
        </div>
        <div class="row-line2">
          <span class="row-city">${esc(l.city || '—')}</span>
          <span class="row-sep">·</span>
          <span class="row-phone">${esc(fmtPhone(l.whatsapp))}</span>
          ${l.duplicate ? '<span class="dup-badge">dup</span>' : ''}
        </div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => {
      STATE.selectedId = row.dataset.id;
      renderList();
      renderDetail();
      openDetailMobile();
    });
  });
}

function isMobile() { return window.matchMedia('(max-width: 720px)').matches; }
function openDetailMobile() { if (isMobile()) document.body.classList.add('show-detail'); }
function closeDetailMobile() { document.body.classList.remove('show-detail'); }

const STATUS_LABEL = { new: 'New', contacted: 'Contacted', booked: 'Booked', lost: 'Lost', junk: 'Junk' };
const STATUS_ORDER = ['new', 'contacted', 'booked', 'lost', 'junk'];

function renderDetail() {
  const el = document.getElementById('detail');
  const lead = STATE.leads.find(l => l.id === STATE.selectedId);
  if (!lead) {
    el.innerHTML = '<div class="detail-empty">Select a lead</div>';
    return;
  }
  const waHref = lead.whatsapp ? `https://wa.me/${esc(lead.whatsapp)}` : '#';
  el.innerHTML = `
    <header class="detail-header">
      <div class="detail-head-row">
        <button type="button" class="mobile-back" id="mobileBack" title="Back to inbox" aria-label="Back to inbox">‹</button>
        <div class="swatch" style="background:${lead.junk ? 'var(--line2)' : esc(lead.swatch)}">${esc(lead.initials)}</div>
        <div class="detail-titlecol">
          <div class="detail-titlerow">
            <h2 class="detail-name ${lead.junk ? 'junk' : ''}">${esc(lead.salon)}</h2>
            <span class="status-chips" id="statusChips" data-id="${esc(lead.id)}">
              ${STATUS_ORDER.map(s => `
                <button type="button" data-status="${s}" class="status-chip s-${s} ${s === lead.status ? 'active' : ''}" title="${STATUS_LABEL[s]}">
                  <span class="status-dot ${s}"></span>
                  <span>${STATUS_LABEL[s]}</span>
                </button>
              `).join('')}
            </span>
            ${lead.duplicate ? '<span class="dup-badge">dup</span>' : ''}
          </div>
          <div class="detail-meta">
            <span>${esc(lead.city || 'No city captured')}</span>
            <span style="opacity:.4">·</span>
            <span class="mono">${esc(fmtPhone(lead.whatsapp))}</span>
            ${lead.at ? `<span style="opacity:.4">·</span><span>${esc(fmtFullDate(lead.at))} at ${esc(fmtTime(lead.at))}</span>` : ''}
          </div>
        </div>
        <div class="detail-actions">
          <a class="btn-primary" id="open-wa" href="${waHref}" target="_blank" rel="noopener">
            <span>WhatsApp</span><kbd>W</kbd>
          </a>
          <button type="button" class="btn-danger" id="deleteBtn" data-id="${esc(lead.id)}" title="Delete this lead">Delete</button>
        </div>
      </div>
      <div class="field-grid">
        <div>
          <div class="field-label">Service</div>
          <div class="field-value">${esc(lead.service || 'Not captured')}</div>
        </div>
        <div>
          <div class="field-label">Source</div>
          <div class="field-value">WhatsApp · bot.eloquentservice.com</div>
        </div>
        <div>
          <div class="field-label">Captured</div>
          <div class="field-value">${esc(lead.at ? fmtFullDate(lead.at) + ', ' + fmtTime(lead.at) : '—')}</div>
        </div>
        <div>
          <div class="field-label">Note</div>
          <div class="field-value">${esc(lead.note || '—')}</div>
        </div>
      </div>
    </header>
    <div class="convo-wrap">
      <div class="convo-header">
        <div class="convo-title">WhatsApp conversation</div>
        <div class="convo-divider"></div>
        <div class="convo-count">Transcript not stored</div>
      </div>
      <div class="convo-empty">
        Rezzy currently stores only the captured lead fields, not full chat history.<br>
        Tap <strong>WhatsApp</strong> above (or press <kbd>W</kbd>) to open the live conversation in WhatsApp.
      </div>
      <div class="quick-actions">
        <div class="quick-actions-title">Quick actions</div>
        <div class="quick-actions-row">
          <span class="shortcut"><span class="keys"><kbd>W</kbd></span><span>Open WhatsApp</span></span>
          <span class="shortcut"><span class="keys"><kbd>J</kbd></span><span>Next</span></span>
          <span class="shortcut"><span class="keys"><kbd>K</kbd></span><span>Previous</span></span>
          <span class="shortcut"><span class="keys"><kbd>/</kbd></span><span>Focus search</span></span>
        </div>
      </div>
    </div>
  `;
  wireDetailInteractions(lead);
}

function wireDetailInteractions(lead) {
  const back = document.getElementById('mobileBack');
  if (back) back.addEventListener('click', closeDetailMobile);
  const chips = document.getElementById('statusChips');
  if (chips) {
    chips.querySelectorAll('button[data-status]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const next = btn.dataset.status;
        if (next === lead.status) return;
        chips.querySelectorAll('button').forEach(b => b.setAttribute('disabled', ''));
        await updateStatus(lead.id, next);
      });
    });
  }
  const delBtn = document.getElementById('deleteBtn');
  if (delBtn) {
    delBtn.addEventListener('click', async () => {
      if (!confirm(`Delete lead "${lead.salon}"? Can be restored from lead-overrides.json on the server.`)) return;
      await deleteLead(lead.id);
    });
  }
}

async function updateStatus(id, status) {
  const lead = STATE.leads.find(l => l.id === id);
  if (!lead) return;
  const prev = lead.status;
  lead.status = status;
  lead.junk = status === 'junk';
  rerender();
  try {
    const res = await fetch('/admin/leads/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify({ id, status }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    document.getElementById('sync-status').textContent = `Status → ${STATUS_LABEL[status]}`;
  } catch (err) {
    lead.status = prev;
    lead.junk = prev === 'junk';
    rerender();
    alert('Failed to update status: ' + err.message);
  }
}

async function deleteLead(id) {
  const idx = STATE.leads.findIndex(l => l.id === id);
  if (idx < 0) return;
  const removed = STATE.leads.splice(idx, 1)[0];
  if (STATE.selectedId === id) STATE.selectedId = null;
  rerender();
  try {
    const res = await fetch('/admin/leads/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify({ id, deleted: true }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    document.getElementById('sync-status').textContent = 'Lead deleted';
  } catch (err) {
    STATE.leads.splice(idx, 0, removed);
    rerender();
    alert('Failed to delete lead: ' + err.message);
  }
}

function rerender() {
  applyFilters();
  renderCounts();
  renderList();
  renderDetail();
}

async function load() {
  document.getElementById('sync-status').textContent = 'Syncing…';
  try {
    const res = await fetch('/admin/leads.json', { cache: 'no-store' });
    if (res.status === 401) { window.location.href = '/admin/login'; return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    STATE.leads = normalize(raw);
    if (!STATE.selectedId) STATE.selectedId = STATE.leads.find(l => !l.junk)?.id || STATE.leads[0]?.id || null;
    rerender();
    document.getElementById('sync-status').textContent = 'Synced just now';
  } catch (err) {
    document.getElementById('sync-status').textContent = 'Error: ' + err.message;
    document.getElementById('list').innerHTML = '<div class="list-empty">Failed to load leads.</div>';
  }
}

// Wire interactions
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  STATE.tab = btn.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
  rerender();
});
document.getElementById('search').addEventListener('input', (e) => {
  STATE.query = e.target.value;
  rerender();
});
document.getElementById('refresh').addEventListener('click', load);

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  const inField = e.target.matches('input, textarea');
  if (e.key === '/' && !inField) { e.preventDefault(); document.getElementById('search').focus(); return; }
  if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); document.getElementById('search').focus(); return; }
  if (inField) return;
  if (e.key === 'j' || e.key === 'ArrowDown') {
    e.preventDefault();
    const i = STATE.filtered.findIndex(l => l.id === STATE.selectedId);
    const next = STATE.filtered[Math.min(STATE.filtered.length - 1, i + 1)];
    if (next) { STATE.selectedId = next.id; renderList(); renderDetail(); }
  } else if (e.key === 'k' || e.key === 'ArrowUp') {
    e.preventDefault();
    const i = STATE.filtered.findIndex(l => l.id === STATE.selectedId);
    const prev = STATE.filtered[Math.max(0, i - 1)];
    if (prev) { STATE.selectedId = prev.id; renderList(); renderDetail(); }
  } else if (e.key === 'w' || e.key === 'W') {
    const lead = STATE.leads.find(l => l.id === STATE.selectedId);
    if (lead?.whatsapp) window.open(`https://wa.me/${lead.whatsapp}`, '_blank', 'noopener');
  } else if (e.key === 'r' || e.key === 'R') {
    load();
  }
});

load();

const deployBtn = document.getElementById('deployBtn');
const deployLabel = document.getElementById('deployLabel');
deployBtn?.addEventListener('click', async () => {
  if (deployBtn.classList.contains('busy')) return;
  if (!confirm('Run git pull + pm2 restart on the server?')) return;
  deployBtn.classList.remove('ok', 'err');
  deployBtn.classList.add('busy');
  deployLabel.textContent = 'Deploying…';
  try {
    const res = await fetch('/admin/deploy', { method: 'POST', cache: 'no-store' });
    const data = await res.json().catch(() => ({}));
    deployBtn.classList.remove('busy');
    if (res.ok && data.ok) {
      deployBtn.classList.add('ok');
      const head = (data.output || '').trim().split('\n')[0] || 'Up to date';
      deployLabel.textContent = head.length > 28 ? head.slice(0, 28) + '…' : head;
      setTimeout(() => { deployBtn.classList.remove('ok'); deployLabel.textContent = 'Deploy'; }, 6000);
    } else {
      deployBtn.classList.add('err');
      deployLabel.textContent = 'Failed';
      console.error('Deploy failed:', data);
      alert('Deploy failed:\n\n' + (data.output || data.error || 'unknown error'));
      setTimeout(() => { deployBtn.classList.remove('err'); deployLabel.textContent = 'Deploy'; }, 6000);
    }
  } catch (err) {
    deployBtn.classList.remove('busy');
    deployBtn.classList.add('err');
    deployLabel.textContent = 'Failed';
    alert('Deploy request failed: ' + err.message);
    setTimeout(() => { deployBtn.classList.remove('err'); deployLabel.textContent = 'Deploy'; }, 6000);
  }
});
</script>
</body>
</html>
